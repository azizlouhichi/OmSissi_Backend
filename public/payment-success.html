<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement réussi - Om Sisi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
      width: 100%;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      animation: scaleIn 0.6s ease-out 0.2s both;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    .success-icon::before {
      content: '✓';
      font-size: 60px;
      color: white;
      font-weight: bold;
    }

    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 15px;
      font-weight: 700;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .loader {
      margin: 30px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .redirect-text {
      color: #999;
      font-size: 14px;
      margin-top: 20px;
    }

    .session-id {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      color: #666;
      margin-top: 20px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon"></div>
    <h1>Paiement réussi !</h1>
    <p>Votre abonnement Om Sisi a été activé avec succès.<br>
    Vous allez être redirigé vers l'application.</p>
    
    <div class="loader"></div>
    
    <p class="redirect-text">Redirection automatique dans <span id="countdown">3</span> secondes...</p>
    
    <div id="session-info" class="session-id" style="display:none;"></div>
  </div>

  <script>
    // Récupérer les paramètres de l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');
    const parentId = urlParams.get('parent_id');
    
    // Afficher le session ID si présent (pour debug)
    if (sessionId) {
      const sessionInfo = document.getElementById('session-info');
      sessionInfo.textContent = `Session: ${sessionId}`;
      // Décommenter pour voir le session ID:
      // sessionInfo.style.display = 'block';
    }

    // Compte à rebours
    let countdown = 3;
    const countdownElement = document.getElementById('countdown');
    
    const interval = setInterval(() => {
      countdown--;
      countdownElement.textContent = countdown;
      
      if (countdown <= 0) {
        clearInterval(interval);
        redirectToApp();
      }
    }, 1000);

    // Fonction de redirection
    function redirectToApp() {
      let deepLink = 'omsisi://subscription-success';
      
      if (sessionId) {
        deepLink += `?session_id=${sessionId}`;
      }
      
      console.log('Redirecting to:', deepLink);
      
      // Tenter la redirection vers l'app
      window.location.href = deepLink;
      
      // Fallback si l'app ne s'ouvre pas après 2 secondes
      setTimeout(() => {
        document.querySelector('.redirect-text').innerHTML = 
          'Si l\'application ne s\'ouvre pas,<br>fermez cet onglet et retournez à l\'app manuellement.';
      }, 2000);
    }

    // Permettre de cliquer pour rediriger immédiatement
    document.querySelector('.container').addEventListener('click', () => {
      clearInterval(interval);
      redirectToApp();
    });
  </script>
</body>
</html>
